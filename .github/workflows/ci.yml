name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Confirm raw data is absent
        run: >-
          python -c "import subprocess;
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines();
          blocked = [path for path in tracked if path.startswith(('data/external/', 'data/private/', 'data/derived/'))];
          assert not blocked, f'Raw or private data is tracked: {blocked}'"

      - name: Run validation tests
        run: python -m unittest discover -s tests -v

